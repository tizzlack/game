name: Release (Windows build)

# Builds the game with Godot and publishes the Windows ZIP as a GitHub release.
# Runs on every push to the development branch (except pure documentation changes) or manually.
on:
  push:
    branches: ["claude/optimistic-noether-dq5njr"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot and export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/version.txt -d "$T"
          rm "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: Import project
        run: ./godot --headless --path . --import || true

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          ./godot --headless --path . --export-release "Windows" build/windows/Glowline.exe
          test -f build/windows/Glowline.exe
          test -f build/windows/steam_api64.dll
          cp steam_appid.txt dist/README.txt "dist/LIES MICH.txt" CREDITS.md build/windows/
          ls -la build/windows

      - name: Pack ZIP
        run: |
          mkdir -p pkg
          cp -r build/windows pkg/GLOWLINE
          cd pkg && zip -q -r -9 ../GLOWLINE-Windows.zip GLOWLINE

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GLOWLINE 1.0.${{ github.run_number }} (Windows)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: GLOWLINE-Windows.zip
          body: |
            **GLOWLINE – Neon Run & Gun** for Windows, with Steam multiplayer.

            1. Download `GLOWLINE-Windows.zip` and unzip it.
            2. Start Steam and log in.
            3. Run `Glowline.exe` (if Windows shows a warning: "More info" → "Run anyway").

            **Play with a friend:** MULTIPLAYER → CREATE LOBBY → send the code to your friend →
            your friend enters the code under MULTIPLAYER (or presses PASTE) → GET READY → START.
            Steam shows "Spacewar" while you play (Valve's test app). That is expected.

            Full controller support, also in all menus (A = confirm, B = back).
            Music by Kevin MacLeod (incompetech.com, CC BY 4.0), sound effects by Kenney (CC0). See `CREDITS.md`.

            More details are in `README.txt` (English) and `LIES MICH.txt` (German) inside the ZIP.
